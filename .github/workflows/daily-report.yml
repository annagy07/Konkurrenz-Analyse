name: Tagesreport per E-Mail

on:
  schedule:
    - cron: "43 5 * * *"   # täglich 05:43 UTC = 07:43 Uhr (Sommerzeit) / 06:43 Uhr (Winterzeit)
  workflow_dispatch:       # zum Testen: Actions → "Tagesreport per E-Mail" → Run workflow

concurrency: radar

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Datenbank des Radars laden
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-db-report-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Eigene Release-Planung aus Secret
        env:
          OWN_RELEASES_YAML: ${{ secrets.OWN_RELEASES_YAML }}
        run: |
          if [ -n "$OWN_RELEASES_YAML" ]; then printf '%s' "$OWN_RELEASES_YAML" > own_releases.yaml; fi

      - name: Report senden
        env:
          # Standard: GMX. Für andere Anbieter Secret SMTP_HOST (und ggf. SMTP_PORT) setzen.
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'mail.gmx.net' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::error::Secrets SMTP_USER und SMTP_PASSWORD fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python -m radar digest
