name: IDs suchen

# Manuell starten (Actions → "IDs suchen" → Run workflow), z. B. nachdem neue Artists in artists.yaml stehen.
# Sucht Deezer- und MusicBrainz-IDs und committet artist_ids.yaml.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Auch bereits gefundene IDs neu suchen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: radar

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: IDs abgleichen
        env:
          REFRESH: ${{ inputs.refresh }}
        run: python -m radar resolve --all $([ "$REFRESH" = "true" ] && echo --refresh)
      - name: artist_ids.yaml committen
        run: |
          git config user.name "release-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artist_ids.yaml
          git diff --cached --quiet || git commit -m "IDs aktualisiert (automatisch)"
          git push
