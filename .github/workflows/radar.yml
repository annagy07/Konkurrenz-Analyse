name: Release-Radar

on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden (UTC)
  workflow_dispatch:
    inputs:
      only:
        description: "Nur Artists, deren Name diesen Text enthält (leer = alle)"
        required: false

concurrency: radar   # nie zwei Läufe gleichzeitig (gemeinsame Datenbank)

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Zustand (bereits gesehene Einträge, Seiten-Snapshots) zwischen Läufen behalten.
      - name: Datenbank wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Eigene Release-Planung aus Secret
        env:
          OWN_RELEASES_YAML: ${{ secrets.OWN_RELEASES_YAML }}
        run: |
          if [ -n "$OWN_RELEASES_YAML" ]; then printf '%s' "$OWN_RELEASES_YAML" > own_releases.yaml; fi

      - name: Radar-Lauf
        env:
          RADAR_HIDE_COLLISIONS_IN_LOG: "1"
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          APPLE_MUSIC_TOKEN: ${{ secrets.APPLE_MUSIC_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ONLY: ${{ inputs.only }}
        run: python -m radar run ${ONLY:+--only "$ONLY"}

      - name: Datenbank sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-db-${{ github.run_id }}

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt && pytest -q
