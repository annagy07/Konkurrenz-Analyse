# Watchlist: 200 für die deutschen Album-Charts relevante Artists.
#
# Auswahl: Album-Jahrescharts und Nummer-1-Alben 2024–2026 (GfK / Offizielle Deutsche Charts), ergänzt um
# Acts mit regelmäßigen Top-10-Alben. Genres bewusst breit: Die Album-1 holen in Deutschland neben Deutschrap
# und internationalen Stars sehr oft Schlager-, Deutschrock- und Legacy-Acts.
#   priority: high  = regelmäßig Platz-1-/Top-3-Potenzial → niedrigere Alarmschwelle
#   skip: true      = Artist vorübergehend nicht prüfen (z. B. eigene Sony-Artists, falls nicht gewünscht)
#
# IDs: Deezer- und MusicBrainz-IDs werden automatisch gesucht (python -m radar resolve --all, oder in GitHub
# über Actions → "IDs suchen") und in artist_ids.yaml gespeichert. Manuelle IDs hier haben Vorrang.
#
# Vollständiges Beispiel mit allen Quellen:
#   - name: Ski Aggu
#     priority: high
#     ids: {deezer: 123, musicbrainz: <uuid>, spotify: <id>, apple_music: <id>, youtube: UC..., instagram: skiaggu}
#     websites: [https://www.example-artist.de]
#     shops: [{url: https://shop.example-label.de, filter: Ski Aggu}]
#     feeds: [{url: https://rsshub.example/instagram/user/skiaggu, label: instagram}]

settings:
  min_score: 5        # ab diesem Score wird alarmiert ("mittel"); ab 10 = "hoch"
  google_news: true

